version: 2

updates:
  # Release, promotion and program-build logic all live in pinned actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # `ci:` releases nothing — a workflow bump should not cut a version.
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: bun
    directory: /
    # Dependabot opens against the default branch; `dev` is where the promote path starts.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    labels: [dependencies]
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', 'vue', 'vue-router', 'vue-tsc', '@vue/*']
      solana:
        patterns: ['@solana/*', '@noble/*', 'bs58']
      testing:
        patterns: ['vitest', '@vitest/*', 'happy-dom', '@vue/test-utils']
      release-tooling:
        patterns:
          [
            'semantic-release',
            '@semantic-release/*',
            '@commitlint/*',
            'husky',
            'lint-staged',
            'conventional-changelog-conventionalcommits',
          ]
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # semantic-release 25 still ships conventional-changelog-writer@8. Preset 10 requires
    # writer 9 and blows up generateNotes — pin stays on the 9.x line until the generator
    # upgrades (https://github.com/semantic-release/release-notes-generator/issues/1027).
    ignore:
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ['version-update:semver-major']

  # The vault program. An anchor-lang bump changes the code that custodies user funds, so it
  # gets the `program` scope that .releaserc.cjs always releases on.
  - package-ecosystem: cargo
    directory: /programs
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(program)'
    labels: [dependencies, solana]
