version: 2

updates:
  # Release, promotion and program-build logic all live in pinned actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # `ci:` releases nothing — a workflow bump should not cut a version.
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: bun
    directory: /
    # Dependabot opens against the default branch; `dev` is where the promote path starts.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope
    labels: [dependencies]
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', 'vue', 'vue-router', 'vue-tsc', '@vue/*']
      solana:
        patterns: ['@solana/*', '@noble/*', 'bs58']
      testing:
        patterns: ['vitest', '@vitest/*', 'happy-dom', '@vue/test-utils']
      release-tooling:
        patterns: ['semantic-release', '@semantic-release/*', '@commitlint/*', 'husky', 'lint-staged']
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # The vault program. An anchor-lang bump changes the code that custodies user funds, so it
  # gets the `program` scope that .releaserc.cjs always releases on.
  - package-ecosystem: cargo
    directory: /programs
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(program)'
    labels: [dependencies, solana]
