name: release

# Commit-driven releases on all three channels.
#
#   push to dev  → 3.1.0-dev.1 …   GitHub Pre-release
#   push to stg  → 3.1.0-rc.1  …   GitHub Pre-release
#   push to main → 3.1.0           GitHub Release
#
# semantic-release reads the Conventional Commits since the last tag on that channel, works out
# the next version, regenerates CHANGELOG.md, bumps package.json and programs/kwami-vault's
# Cargo.toml, tags, and cuts the GitHub Release. After a stable release it back-merges `main`
# into `stg` and `dev` so every channel shares one version baseline.
#
# Kwami v3 is an application, not a package: nothing is published to npm. The release is the
# tag, the changelog and the GitHub Release that a deploy is cut from.
#
# It runs on the back of `ci` rather than on the push itself, so no version is ever cut from a
# red commit. The release commit is pushed with GITHUB_TOKEN, which by design does not trigger
# workflows — the bump cannot re-run CI or release itself in a loop.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev, stg, main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    # `workflow_run` also fires for the PR runs of `ci`; only a green *push* to a channel counts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Empty on a manual run — there is no "the commit ci tested", so the drift guard stands down.
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The branch, not the tested SHA: semantic-release commits and pushes onto it.
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate git for the release and back-merge pushes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      # A push that landed while CI was running has its own CI run behind it; let that one
      # release rather than shipping a commit these gates never saw.
      - name: Refuse to release an untested tip
        env:
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -euo pipefail
          tip="$(git rev-parse HEAD)"
          if [ -z "${TESTED_SHA:-}" ]; then
            echo "::notice::Manual run on ${RELEASE_BRANCH} at ${tip} — no ci run to compare against."
          elif [ "$tip" != "$TESTED_SHA" ]; then
            echo "::notice::Branch tip ${tip} is ahead of the tested commit ${TESTED_SHA} — its own run will release."
            echo 'skip=true' >> "$GITHUB_ENV"
          fi

      - if: env.skip != 'true'
        uses: ./.github/actions/setup-workspace
        with:
          node: 'true'

      # Without a `v*` tag semantic-release would call this a first release and jump to 1.0.0 —
      # a downgrade from the 3.0.0 in package.json.
      - name: Ensure the release baseline tag exists
        if: env.skip != 'true'
        run: bun run release:baseline

      - name: Record existing tags
        if: env.skip != 'true'
        run: git tag > "$RUNNER_TEMP/tags-before.txt"

      - name: Release
        if: env.skip != 'true'
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always() && env.skip != 'true'
        run: |
          set -euo pipefail
          git tag > "$RUNNER_TEMP/tags-after.txt"
          cut="$(comm -13 "$RUNNER_TEMP/tags-before.txt" "$RUNNER_TEMP/tags-after.txt" || true)"
          {
            echo '### Release'
            echo ''
            if [ -n "$cut" ]; then
              printf '%s\n' "$cut" | sed 's/^/- /'
            else
              echo 'No releasable changes on this channel.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
